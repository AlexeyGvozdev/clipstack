# SwiftLint Configuration for ClipStack

# Включенные правила
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Отключенные правила
disabled_rules:
  - trailing_whitespace

# Исключенные директории
excluded:
  - Pods
  - .build
  - DerivedData
  - .swiftpm

# Длина строки
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

# Длина файла
file_length:
  warning: 500
  error: 1000

# Длина функции
function_body_length:
  warning: 50
  error: 100

# Длина типа
type_body_length:
  warning: 300
  error: 500

# Количество параметров функции
function_parameter_count:
  warning: 5
  error: 8

# Вложенность типов
nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Идентификаторы
identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y

