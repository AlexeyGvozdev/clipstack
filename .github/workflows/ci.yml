  code-quality:
    name: Code Quality Checks
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for TODO comments
      run: |
        echo "Checking for TODO comments..."
        if grep -r "TODO" ClipStack/Sources --exclude-dir=.build; then
          echo "⚠️  Found TODO comments in code"
          exit 0
        else
          echo "✅ No TODO comments found"
        fi
        
    - name: Check file headers
      run: |
        echo "Checking file headers..."
        missing_headers=0
        for file in $(find ClipStack/Sources -name "*.swift"); do
          if ! head -n 1 "$file" | grep -q "//"; then
            echo "❌ Missing header in: $file"
            missing_headers=$((missing_headers + 1))
          fi
        done
        if [ $missing_headers -gt 0 ]; then
          echo "⚠️  Found $missing_headers files with missing headers"
          exit 1
        else
          echo "✅ All files have proper headers"
        fi
        
    - name: Check line count
      run: |
        echo "Checking for large files..."
        large_files=0
        for file in $(find ClipStack/Sources -name "*.swift"); do
          lines=$(wc -l < "$file")
          if [ $lines -gt 500 ]; then
            echo "⚠️  Large file ($lines lines): $file"
            large_files=$((large_files + 1))
          fi
        done
        if [ $large_files -gt 0 ]; then
          echo "Found $large_files large files (>500 lines)"
        else
          echo "✅ No large files found"
        fi